name: Auto Update TV Config

on:
  schedule:
    # 每 6 小时自动跑一次（UTC 时间，17 分错峰）
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # 也可以在网页上手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 转换上游 LunaTV 配置
        run: python convert.py --include-adult

      - name: 提交变更
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oktv.json oktv-alive.json tvbox.json tvbox-alive.json oktv-safe.json oktv-safe-alive.json version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化，跳过提交"
          else
            git commit -m "chore: auto update config $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 通知 jsDelivr 刷新缓存
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in oktv.json oktv-alive.json tvbox.json version.json; do
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" > /dev/null || true
          done
          echo "已请求 jsDelivr 刷新"
